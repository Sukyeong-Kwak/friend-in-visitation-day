<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        font-family: 'Pretendard Variable', 'Pretendard', system-ui, sans-serif;
        letter-spacing: -0.01em;
        background: #faf7f3;
      }

      .og {
        position: relative;
        width: 1200px;
        height: 630px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        isolation: isolate;
        background: linear-gradient(160deg, #ece6f6 0%, #f3ebf3 38%, #fbeee9 72%, #fdf4ee 100%);
      }

      .bloom {
        position: absolute;
        z-index: -1;
        border-radius: 50%;
        filter: blur(90px);
      }
      .bloom--1 {
        top: -180px; left: 40px;
        width: 460px; height: 460px;
        background: rgba(169, 155, 216, 0.42);
      }
      .bloom--2 {
        bottom: -200px; right: 20px;
        width: 480px; height: 480px;
        background: rgba(240, 177, 156, 0.4);
      }

      .host {
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #a09a92;
      }
      .host b { font-weight: 800; color: #8272bd; }

      .chip {
        margin-top: 26px;
        padding: 11px 30px;
        border-radius: 999px;
        font-size: 27px;
        font-weight: 700;
        color: #8272bd;
        background: #fff;
        box-shadow: 0 6px 18px rgba(140, 120, 190, 0.13);
      }

      .title {
        margin-top: 16px;
        font-size: 132px;
        font-weight: 900;
        line-height: 1.1;
        letter-spacing: -0.035em;
        color: #17161a;
      }

      .when {
        margin-top: 26px;
        text-align: center;
      }
      .when-line {
        font-size: 50px;
        font-weight: 900;
        letter-spacing: -0.03em;
        color: #35312c;
        font-variant-numeric: tabular-nums;
      }
      .when-place {
        margin-top: 8px;
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.03em;
        color: #6f6a63;
      }
    </style>
  </head>
  <body>
    <div class="og">
      <span class="bloom bloom--1"></span>
      <span class="bloom bloom--2"></span>

      <p class="host">포도나무교회 청년부 <b>친구초청잔치</b></p>
      <span class="chip">2026 청년부 뮤지컬</span>
      <h1 class="title">청년시선</h1>

      <div class="when">
        <div class="when-line">2026.8.17 MON 7PM</div>
        <div class="when-place">포도나무교회 본당</div>
      </div>
    </div>
  </body>
</html>
